[package]
name = "palamedes-cli"
version = "1.17.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native command-line interface for Palamedes."

[[bin]]
name = "pmds"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
config = { version = "0.15.25", default-features = false, features = ["json", "toml", "yaml"] }
globset = "0.4.20"
ignore = "0.4.33"
notify = "8.2.0"
palamedes = { path = "../palamedes" }
palamedes-plugin = { path = "../palamedes-plugin" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
signal-hook = "0.4.4"
