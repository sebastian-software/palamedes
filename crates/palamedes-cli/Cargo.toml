[package]
name = "palamedes-cli"
version = "1.25.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native command-line interface for Palamedes."
readme = "README.md"
keywords = ["i18n", "internationalization", "cli", "gettext", "ferramenta"]
categories = ["command-line-utilities", "internationalization", "development-tools"]
# ADR-024 keeps a Node-free escape hatch open, which `cargo install
# palamedes-cli` would serve. That decision is still open
# (sebastian-software/palamedes#1153); until then nothing may reach the
# registry by accident.
publish = false

[lints]
workspace = true

[[bin]]
name = "pmds"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
config = { version = "0.15.25", default-features = false, features = ["json", "toml", "yaml"] }
# Source discovery. 0.5.0 is the first release with `resolve_symlink_kind`,
# which is what makes the walk's idea of a file match palamedes'.
ferralk = "0.5.3"
globset = "0.4.20"
notify = "8.2.0"
palamedes = { path = "../palamedes" }
palamedes-plugin = { path = "../palamedes-plugin" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
ureq = { version = "3.4.0", default-features = false, features = ["json", "rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
signal-hook = "0.4.4"
