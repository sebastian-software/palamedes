[package]
name = "palamedes-cli"
version = "1.25.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native command-line interface for Palamedes."
readme = "README.md"
keywords = ["i18n", "internationalization", "cli", "gettext", "ferramenta"]
categories = ["command-line-utilities", "internationalization", "development-tools"]
# ADR-014 keeps a Node-free escape hatch open, which `cargo install
# palamedes-cli` would serve. That decision is still open
# (sebastian-software/palamedes#1153); until then nothing may reach the
# registry by accident.
publish = false

[lints]
workspace = true

[[bin]]
name = "pmds"
path = "src/main.rs"

[dependencies]
app-tracking = "0.2.1"
palamedes-build = { version = "1.25.1", path = "../palamedes-build" }
palamedes-i18n = { version = "1.25.1", path = "../palamedes-i18n" }
clap = { version = "4.6.6", features = ["derive"] }
config = { version = "0.15.25", default-features = false, features = ["json", "toml", "yaml"] }
# Source traversal and watch matching share Ferralk's stable walker dialect.
ferralk = "1.1.0"
notify = "8.2.0"
palamedes = { version = "1.25.1", path = "../.." }
palamedes-plugin = { version = "1.25.1", path = "../palamedes-plugin" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
signal-hook = "0.4.4"

[build-dependencies]
palamedes-build = { version = "1.25.1", path = "../palamedes-build" }

[dev-dependencies]
palamedes-build = { version = "1.25.1", path = "../palamedes-build" }
