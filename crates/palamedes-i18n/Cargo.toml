[package]
name = "palamedes-i18n"
version = "1.25.1"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Parser-free Rust runtime for external Palamedes catalogs."
documentation = "https://docs.rs/palamedes-i18n"
readme = "README.md"
include = ["/src/**", "/tests/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
keywords = ["i18n", "internationalization", "gettext", "ferramenta"]
categories = ["internationalization", "development-tools"]
# Publication needs a reviewed release-enablement change as well as the policy gate.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
fixed_decimal = "0.7.2"
icu_locale_core = "2.3.0"
icu_plurals = "2.3.0"
# Keep cached ICU rule payloads Send + Sync for shared catalogs.
icu_provider = { version = "2.3.1", features = ["sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.27.0"
