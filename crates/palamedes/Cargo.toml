[package]
name = "palamedes"
version = "1.17.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust core for Palamedes."

[features]
test-support = []

[dependencies]
ferrocat = "=3.4.2"
ferrocat-icu = "=3.4.2"
ferrocat-po = "=3.4.2"
ferromark = { version = "=0.7.0", features = ["mdx"] }
oxc_allocator = "0.144.0"
oxc_ast = "0.144.0"
oxc_ast_visit = "0.144.0"
oxc_parser = "0.144.0"
oxc_semantic = "0.144.0"
oxc_span = "0.144.0"
oxc_syntax = "0.144.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
string_wizard = "1.2.3"
tempfile = "3.27.0"
thiserror = "2.0.20"

[dev-dependencies]
ignore = "0.4.33"
