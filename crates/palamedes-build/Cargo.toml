[package]
name = "palamedes-build"
version = "1.25.1"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cargo build integration for external Palamedes Rust catalogs."
documentation = "https://docs.rs/palamedes-build"
readme = "README.md"
include = ["/src/**", "/tests/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
keywords = ["i18n", "internationalization", "gettext", "ferramenta"]
categories = ["internationalization", "development-tools"]
# Release-enabled for crates.io only; .release-policy.json still gates the lane.
publish = ["crates-io"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
palamedes = { version = "1.25.1", path = "../.." }
# Exact `=` pin inherited from the workspace: generated code constructs hidden
# palamedes-i18n items, so both crates must come from the same release.
palamedes-i18n = { workspace = true }
# A caret requirement, like the core crate; Cargo.lock pins the tested version.
ferrocat = "3.4.2"
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
syn = { version = "2.0.119", features = ["full", "parsing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
sha2 = "0.11.0"

tempfile = "3.27.0"

[dev-dependencies]
# Renders parsed signatures in the sdk boundary test.
quote = "1.0.47"
