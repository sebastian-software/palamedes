[package]
name = "palamedes-node"
version = "1.25.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Node.js bindings for the Palamedes Rust core."
readme = "README.md"
# The addon ships inside the @palamedes/core-node platform packages.
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
test-support = ["palamedes/test-support"]

[dependencies]
napi = { version = "3.12.2", default-features = false, features = ["napi9"] }
napi-derive = "3.6.3"
palamedes = { path = "../palamedes" }
serde_json = "1.0.151"

[dev-dependencies]
# AsyncTask pulls additional N-API calls into the Rust test harness. Load them
# dynamically in tests, where no Node executable exists to provide symbols.
napi = { version = "3.12.2", default-features = false, features = ["dyn-symbols"] }

[build-dependencies]
napi-build = "2.4.1"
