packages:
  - "packages/*"
  - "examples/*"
  - "benchmarks/*"
  - "site"

overrides:
  "eslint-config-setup>eslint-plugin-oxlint": "1.76.0"
  # Security patches permitted by each parent's existing dependency line.
  # Remove these once the parent lock resolutions reach the patched versions.
  "@remix-run/test>esbuild": "0.28.1"
  "ajv>fast-uri": "3.1.5"
  "jsdom>undici": "7.29.0"
  "next>postcss": "8.5.23"
  "postcss-svgo>svgo": "4.0.2"
  "tsx>esbuild": "0.28.1"
  # @vercel/blob 2.4 permits this patched Undici line; remove after its lock resolves >=6.28.
  "@vercel/blob>undici": "6.28.0"
  # vinxi 0.5.11 pins h3 1.15.3; remove once vinxi permits a patched h3.
  "vinxi>h3": "1.15.10"
  "waku>vite": "^8.2.0"
  "waku>@vitejs/plugin-react": "^6.0.5"

peerDependencyRules:
  allowedVersions:
    "eslint-plugin-jsx-a11y>eslint": "^10.0.0"

onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - sharp
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@oxc-parser/binding-android-arm-eabi@0.132.0"
  - "@oxc-parser/binding-android-arm64@0.132.0"
  - "@oxc-parser/binding-darwin-arm64@0.132.0"
  - "@oxc-parser/binding-darwin-x64@0.132.0"
  - "@oxc-parser/binding-freebsd-x64@0.132.0"
  - "@oxc-parser/binding-linux-arm-gnueabihf@0.132.0"
  - "@oxc-parser/binding-linux-arm-musleabihf@0.132.0"
  - "@oxc-parser/binding-linux-arm64-gnu@0.132.0"
  - "@oxc-parser/binding-linux-arm64-musl@0.132.0"
  - "@oxc-parser/binding-linux-ppc64-gnu@0.132.0"
  - "@oxc-parser/binding-linux-riscv64-gnu@0.132.0"
  - "@oxc-parser/binding-linux-riscv64-musl@0.132.0"
  - "@oxc-parser/binding-linux-s390x-gnu@0.132.0"
  - "@oxc-parser/binding-linux-x64-gnu@0.132.0"
  - "@oxc-parser/binding-linux-x64-musl@0.132.0"
  - "@oxc-parser/binding-openharmony-arm64@0.132.0"
  - "@oxc-parser/binding-wasm32-wasi@0.132.0"
  - "@oxc-parser/binding-win32-arm64-msvc@0.132.0"
  - "@oxc-parser/binding-win32-ia32-msvc@0.132.0"
  - "@oxc-parser/binding-win32-x64-msvc@0.132.0"
  - "@oxc-project/types@0.132.0"
  - "@types/node@26.0.0"
  - oxc-parser@0.132.0
  - eslint@10.5.0
  - "@react-router/dev@8.3.0"
  - "@react-router/express@8.3.0"
  - "@react-router/node@8.3.0"
  - "@react-router/serve@8.3.0"
  - react-router@8.3.0
