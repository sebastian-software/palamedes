packages:
  - "packages/*"
  - "examples/*"
  - "benchmarks/*"
  - "site"

overrides:
  "eslint-config-setup>eslint-plugin-oxlint": "1.77.0"
  # Security patches permitted by each parent's existing dependency line.
  # Remove these once the parent lock resolutions reach the patched versions.
  "brace-expansion@1.1.12": "1.1.18"
  "brace-expansion@2.1.1": "2.1.4"
  "brace-expansion@5.0.8": "5.0.9"
  "defu@6.1.4": "6.1.7"
  "gt>esbuild": "0.28.2"
  "js-yaml@3.15.0": "3.15.1"
  "postcss@8.5.22": "8.5.26"
  "@remix-run/test>esbuild": "0.28.2"
  "ajv>fast-uri": "4.1.2"
  "jsdom>undici": "8.10.0"
  "next>postcss": "8.5.26"
  "postcss-svgo>svgo": "4.0.2"
  # unbuild 3.6 permits this TS 7-compatible dts plugin line.
  "unbuild>rollup-plugin-dts": "6.5.1"
  "tsx>esbuild": "0.28.2"
  # @vercel/blob 2.4 permits this patched Undici line; remove after its lock resolves >=8.
  "@vercel/blob>undici": "8.10.0"
  "waku>vite": "^8.2.0"
  "waku>@vitejs/plugin-react": "^6.0.5"

peerDependencyRules:
  allowedVersions:
    "eslint-plugin-jsx-a11y>eslint": "^10.0.0"

onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - sharp
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true
  # Native build for gtx-cli's Python extractor. The benchmark lane only
  # extracts from TypeScript sources, so the binding is never loaded.
  tree-sitter-python: false
  unrs-resolver: true
minimumReleaseAgeExclude:
