[package]
name = "palamedes-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
palamedes = { path = ".." }
palamedes-plugin = { path = "../crates/palamedes-plugin" }
config = { version = "=0.15.25", default-features = false, features = ["json", "toml", "yaml"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[workspace]
members = ["."]

[[bin]]
name = "source"
path = "fuzz_targets/source.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plugin"
path = "fuzz_targets/plugin.rs"
test = false
doc = false
bench = false
