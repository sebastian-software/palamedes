[package]
name = "palamedes"
version = "1.25.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared extraction, catalog, ICU, and transform compiler for Palamedes."
documentation = "https://docs.rs/palamedes"
readme = "crates/palamedes/README.md"
include = [
  "/crates/palamedes/src/**",
  "/crates/palamedes/fixtures/**",
  "/crates/palamedes/README.md",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]
keywords = ["i18n", "internationalization", "icu", "gettext", "ferramenta"]
categories = ["internationalization", "development-tools", "text-processing"]
# Published to crates.io as the compiler behind palamedes-build (#1309). The
# allowlist names crates.io only; .release-policy.json also gates the lane.
publish = ["crates-io"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
path = "crates/palamedes/src/lib.rs"

[lints]
workspace = true

[features]
test-support = []

[dependencies]
# Published crates use caret requirements so downstream graphs can resolve a
# newer compatible Ferrocat. Cargo.lock still pins the exact versions that the
# npm packages, the CLI, and CI build and test.
ferrocat = "3.4.2"
ferrocat-icu = "3.4.2"
ferrocat-po = "3.4.2"
ferromark = { version = "3.7.0", features = ["jsx"] }
oxc_allocator = "0.146.0"
oxc_ast = "0.146.0"
oxc_ast_visit = "0.146.0"
oxc_diagnostics = "0.146.0"
oxc_parser = "0.146.0"
oxc_semantic = "0.146.0"
oxc_span = "0.146.0"
oxc_syntax = "0.146.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
string_wizard = "1.2.7"
tempfile = "3.27.0"
thiserror = "2.0.20"

[dev-dependencies]
ignore = "0.4.33"

[workspace]
members = [
  "crates/palamedes-cli",
  "crates/palamedes-node",
  "crates/palamedes-plugin",
  "crates/palamedes-i18n",
  "crates/palamedes-build",
  "crates/palamedes-i18n/examples/cli",
]
default-members = [".", "crates/palamedes-cli", "crates/palamedes-node", "crates/palamedes-plugin"]
resolver = "2"

[workspace.dependencies]
# Code generated by palamedes-build constructs hidden palamedes-i18n items, which
# SemVer does not cover, so palamedes-build pins palamedes-i18n to its own release
# (the serde/serde_derive pattern). The pin lives here because release-please's
# Cargo updater rewrites a member's `=` requirement to a caret one; a generic
# extra-file bumps this marked line instead. check-release-set keeps it exact.
palamedes-i18n = { version = "=1.25.1", path = "crates/palamedes-i18n" } # x-release-please-version

[workspace.package]
authors = ["Sebastian Software GmbH"]
edition = "2024"
homepage = "https://palamedes.dev"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sebastian-software/palamedes"
rust-version = "1.96"

[profile.release]
# Native npm packages ship the release artifacts, not their debug symbols.
strip = "symbols"

[workspace.lints.rust]
future_incompatible = "warn"
unused_must_use = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
question_mark = "warn"
redundant_clone = "warn"
needless_borrow = "warn"
unnecessary_get_then_check = "warn"
