[package]
name = "palamedes"
version = "1.25.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust core for Palamedes."
readme = "crates/palamedes/README.md"
include = ["crates/palamedes/src/**", "crates/palamedes/fixtures/**", "crates/palamedes/README.md"]
keywords = ["i18n", "internationalization", "icu", "gettext", "ferramenta"]
categories = ["internationalization", "development-tools", "text-processing"]
# The Rust core ships through the npm packages today. Publishing it to
# crates.io is still open (sebastian-software/palamedes#1153); until that is
# decided, nothing may reach the registry by accident.
publish = false

[lib]
path = "crates/palamedes/src/lib.rs"

[lints]
workspace = true

[features]
test-support = []

[dependencies]
ferrocat = "=3.4.2"
ferrocat-icu = "=3.4.2"
ferrocat-po = "=3.4.2"
ferromark = { version = "=0.7.0", features = ["mdx"] }
oxc_allocator = "0.146.0"
oxc_ast = "0.146.0"
oxc_ast_visit = "0.146.0"
oxc_diagnostics = "0.146.0"
oxc_parser = "0.146.0"
oxc_semantic = "0.146.0"
oxc_span = "0.146.0"
oxc_syntax = "0.146.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
string_wizard = "1.2.7"
tempfile = "3.27.0"
thiserror = "2.0.20"

[dev-dependencies]
ignore = "0.4.33"

[workspace]
members = ["crates/palamedes-cli", "crates/palamedes-node", "crates/palamedes-plugin"]
default-members = [".", "crates/palamedes-cli", "crates/palamedes-node", "crates/palamedes-plugin"]
resolver = "2"

[workspace.package]
authors = ["Sebastian Software GmbH"]
edition = "2024"
homepage = "https://palamedes.dev"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sebastian-software/palamedes"
rust-version = "1.95"

[profile.release]
# Native npm packages ship the release artifacts, not their debug symbols.
strip = "symbols"

[workspace.lints.rust]
future_incompatible = "warn"
unused_must_use = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
question_mark = "warn"
redundant_clone = "warn"
needless_borrow = "warn"
unnecessary_get_then_check = "warn"
