name: Capture Example Screenshots

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      # Workflow YAML cannot build a choice list from the example matrix, so this
      # is generated from `selectScreenshotExamples` and pinned against it by
      # scripts/workflow-contracts.test.mjs — an example added to the matrix
      # fails that test until it is listed here.
      example_id:
        description: Example to capture
        required: true
        default: all
        type: choice
        options:
          - all
          - nextjs-cookie
          - nextjs-route
          - tanstack-cookie
          - tanstack-route
          - waku-cookie
          - waku-route
          - react-router-cookie
          - react-router-route
          - solidstart-cookie
          - solidstart-route
          - nextjs-subdomain
          - tanstack-subdomain
          - waku-subdomain
          - react-router-subdomain
          - solidstart-subdomain
          - nextjs-tld
          - tanstack-tld
          - waku-tld
          - react-router-tld
          - solidstart-tld

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture screenshots
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.example_id }}" != "all" ]; then
            pnpm capture:example-screenshots -- --id "${{ inputs.example_id }}"
          else
            pnpm capture:example-screenshots
          fi

      - name: Upload screenshot artifacts
        uses: actions/upload-artifact@v7
        with:
          name: example-screenshots
          path: docs/example-screenshots
