name: Publish Examples Container

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths:
      - "Containerfile"
      - ".containerignore"
      - ".dockerignore"
      - ".npmrc"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/**"
      - "crates/**"
      - "examples/**"
      - "scripts/**"
      - ".github/workflows/publish-examples-container.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and smoke-test the image without publishing (also allowed on branches)"
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-examples-container-${{ github.ref }}
  cancel-in-progress: false

# The container build installs and executes the full dependency tree, so the
# jobs default to read-only; the publishing job opts into what it needs.
permissions:
  contents: read

jobs:
  # Demo images follow main independently of npm/crates release authorization.
  # Branch dispatches can build and smoke-test, but cannot publish image tags.
  build-and-push:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    # Native x86_64 runner (the target host arch) so the Containerfile's Rust addon
    # builds without emulation.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/palamedes-examples
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # linux/amd64 only (the target host arch), built natively on the x86_64
      # runner: the Containerfile compiles the native Rust addon at build time, so
      # an emulated build would be prohibitively slow.
      - name: Build runtime image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test Remix in the runtime image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/palamedes-examples:sha-${{ github.sha }}
        run: |
          docker run -d --name examples-smoke \
            -e PALAMEDES_EXAMPLES=remix-cookie,remix-route,remix-subdomain,remix-tld "$IMAGE"
          trap 'docker logs examples-smoke; docker rm -f examples-smoke' EXIT
          docker exec examples-smoke node scripts/container/verify-remix.mjs
          docker stats --no-stream examples-smoke
          test "$(docker inspect --format '{{.State.Running}}' examples-smoke)" = true

      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image tags
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/palamedes-examples
          REVISION: ${{ github.sha }}
        run: |
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:latest"

      - name: Record deployment image
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/palamedes-examples
          REVISION: ${{ github.sha }}
        run: |
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$REVISION")
          {
            echo '## Verified examples image'
            echo "Git revision: $REVISION"
            echo "Image: $digest"
            echo 'Remix runtime smoke checks passed for all four strategies.'
            echo 'Public HTTPS browser verification is still required before advertising live demos.'
          } >> "$GITHUB_STEP_SUMMARY"
