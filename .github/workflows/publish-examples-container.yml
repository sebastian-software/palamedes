name: Publish Examples Container

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Build and push the examples container even without a release commit"
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-examples-container-${{ github.ref }}
  cancel-in-progress: false

# The container build installs and executes the full dependency tree, so the
# jobs default to read-only; the publishing job opts into what it needs.
permissions:
  contents: read

jobs:
  # Mirror publish.yml: only proceed when a release-please "chore: release <version>"
  # commit just landed on main (i.e. a release PR was merged), or on a manual
  # force_publish dispatch.
  determine-release:
    runs-on: ubuntu-24.04
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Detect release commit
        id: release
        env:
          BASE_REF: ${{ github.event.before }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish && 'true' || 'false' }}
        run: node ./scripts/determine-release.mjs

  build-and-push:
    needs: determine-release
    if: needs.determine-release.outputs.should_publish == 'true'
    # Native x86_64 runner (the target host arch) so the Containerfile's Rust addon
    # builds without emulation.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/palamedes-examples
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # linux/amd64 only (the target host arch), built natively on the x86_64
      # runner: the Containerfile compiles the native Rust addon at build time, so
      # an emulated build would be prohibitively slow.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
