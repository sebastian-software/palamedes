name: Measure All Examples Resources

on:
  push:
    branches:
      - codex/demo-resource-measurement
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Measurement only; no publication or deployment"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  measure:
    if: github.ref == 'refs/heads/codex/demo-resource-measurement' && (github.event_name == 'push' || inputs.dry_run)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-workspace
        with:
          rust: "false"
          rust-cache: "false"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Prepare the exact application snapshot without host tooling
        run: |
          git fetch --depth=1 origin 62cf1e9af6b20519d2671bde3c23c610abecc0f8
          mkdir -p /tmp/examples-image-context
          git archive 62cf1e9af6b20519d2671bde3c23c610abecc0f8 | tar -x -C /tmp/examples-image-context
      - name: Build unchanged production examples image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: /tmp/examples-image-context
          file: /tmp/examples-image-context/Containerfile
          platforms: linux/amd64
          load: true
          tags: examples-resources:measure
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Install host-side browser tooling after the clean image build.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Measure all 25 servers using the existing verification corpus
        env:
          MEASURE_IMAGE: examples-resources:measure
        run: node scripts/container/measure-resources.mjs
      - name: Preserve raw samples and verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: all-25-resource-measurement
          path: resource-measurement/
          if-no-files-found: warn
          retention-days: 30
