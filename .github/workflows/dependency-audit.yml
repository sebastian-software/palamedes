name: Dependency Audit

# Advisories are published independently of this repository's changes, so this
# runs on a schedule rather than per pull request: a newly disclosed CVE in a
# build dependency should open a tracking issue, not block unrelated work.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

# The audit job installs npm dependencies and compiles cargo-audit, so it stays
# read-only; only the downstream reporting job opts into `issues: write`.
permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      npm_audit_outcome: ${{ steps.npm-audit.outcome }}
      cargo_audit_outcome: ${{ steps.cargo-audit.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The curated `overrides` block in pnpm-workspace.yaml is the repository's
      # mechanism for pinning patched transitive versions. This report is what
      # tells maintainers when that list has fallen behind.
      # The audit exit code is the signal that decides whether the tracking issue
      # is opened, so it has to survive into the step outcome. `continue-on-error`
      # keeps the job going; swallowing the code here with `|| true` would make
      # that outcome permanently `success` and the issue step unreachable.
      - name: Audit npm dependencies
        id: npm-audit
        continue-on-error: true
        run: |
          set -uo pipefail
          {
            echo '## npm advisories'
            echo
            echo '```'
          } >> audit-report.md

          status=0
          pnpm audit --audit-level=high >> audit-report.md 2>&1 || status=$?

          echo '```' >> audit-report.md
          exit "$status"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        id: cargo-audit
        continue-on-error: true
        run: |
          set -uo pipefail
          {
            echo
            echo '## Rust advisories'
            echo
            echo '```'
          } >> audit-report.md

          status=0
          cargo audit >> audit-report.md 2>&1 || status=$?

          echo '```' >> audit-report.md
          exit "$status"

      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-audit
          path: audit-report.md

  # One long-lived issue that is refreshed in place, so a weekly cron cannot
  # accumulate a backlog of near-identical reports. Kept in a downstream job so
  # `issues: write` is never exposed to `pnpm install` or `cargo install`.
  report-issue:
    name: report audit findings
    needs: audit
    if: >-
      always() &&
      needs.audit.result == 'success' &&
      (needs.audit.outputs.npm_audit_outcome == 'failure' ||
      needs.audit.outputs.cargo_audit_outcome == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download audit report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-audit
          path: audit-report

      - name: Open or refresh the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "chore(deps): dependency audit findings"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "The scheduled dependency audit reported findings."
            echo
            echo "Triage each entry against the curated \`overrides\` block in"
            echo "\`pnpm-workspace.yaml\`, and pin the patched version where the parent"
            echo "dependency line permits it."
            echo
            cat audit-report/audit-report.md
            echo
            echo "Run: $RUN_URL"
          } > issue-body.md

          node ./scripts/open-or-refresh-issue.mjs \
            --title "$TITLE" \
            --body-file issue-body.md \
            --label dependencies
