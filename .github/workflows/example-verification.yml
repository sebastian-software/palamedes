name: Example Verification

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "examples/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "scripts/example-matrix*.mjs"
      - "scripts/example-time-zone-contract.test.mjs"
      - "scripts/container/**"
      - "scripts/verify-examples*.mjs"
      - "scripts/verify-browser-artifacts.mjs"
      - "scripts/proof-*.mjs"
      - "scripts/verify-*-catalog-delivery.mjs"
      - "scripts/check-example-matrix.mjs"
      - "tests/examples-browser/**"
      - "tsconfig*.json"
      - "vitest.examples.config.mjs"
      - ".github/workflows/example-verification.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "examples/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "scripts/example-matrix*.mjs"
      - "scripts/example-time-zone-contract.test.mjs"
      - "scripts/container/**"
      - "scripts/verify-examples*.mjs"
      - "scripts/verify-browser-artifacts.mjs"
      - "scripts/proof-*.mjs"
      - "scripts/verify-*-catalog-delivery.mjs"
      - "scripts/check-example-matrix.mjs"
      - "tests/examples-browser/**"
      - "tsconfig*.json"
      - "vitest.examples.config.mjs"
      - ".github/workflows/example-verification.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      run_browser:
        description: Run the scheduled Playwright browser layer as well as smoke verification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: example-verification-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: example matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check example matrix selection
        run: pnpm check:example-matrix && pnpm check:example-contracts

      - name: Build workspace packages
        run: pnpm build

      - name: Verify time-zone hydration contract
        run: pnpm verify:example-time-zone-contract

      - name: Smoke-test all 25 examples
        run: pnpm verify:examples:smoke

      - name: Install Playwright Chromium
        if: github.event_name != 'workflow_dispatch' || inputs.run_browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser-test 22 browser-capable examples
        if: github.event_name != 'workflow_dispatch' || inputs.run_browser
        env:
          PALAMEDES_BROWSER_RETRY: ${{ github.event_name == 'schedule' && '1' || '0' }}
          PALAMEDES_SCREENSHOT_DIR: artifacts/example-screenshots
        run: pnpm verify:examples:browser -- --capture-screenshots

      - name: Upload browser diagnostics
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run_browser) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: example-browser-diagnostics-${{ github.run_id }}
          path: |
            artifacts/example-screenshots
            coverage/catalog-delivery
          if-no-files-found: warn
          retention-days: 7
