name: Publish

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish the current release version even without a release commit"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Verify native, JavaScript, and Cargo SDK artifacts without publishing anything"
        required: false
        type: boolean
        default: false

# Every main push starts this workflow, so a workflow-level concurrency group
# let the next ordinary push replace a pending release run, which GitHub then
# cancels. Only the upload jobs serialize instead, per job (and per native
# package), and only in release runs: their group falls back to the run id when
# the run does not publish, so other pushes never queue against or cancel them.

# The release gate installs and executes the full dependency tree, so the jobs
# around it default to read-only; the publish jobs opt into `id-token: write`
# for trusted publishing and the failure notifier into `issues: write`.
permissions:
  contents: read

jobs:
  determine-release:
    runs-on: ubuntu-24.04
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Detect release commit
        id: release
        env:
          BASE_REF: ${{ github.event.before }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && (inputs.force_publish || inputs.dry_run) && 'true' || 'false' }}
        run: node ./scripts/determine-release.mjs

  # npm and crates.io uploads run in separate jobs and cannot be rolled back.
  # This proves the Cargo lane is ready before either registry receives
  # anything, so npm cannot ship a release that crates.io then rejects. Every
  # upload job depends on it. A dry run checks the registry state without
  # requesting a crates.io token.
  preflight-cargo:
    needs: determine-release
    if: needs.determine-release.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          pnpm-cache: "false"
          rust-cache: "false"

      # The exchange succeeds only when crates.io trusts this repository and
      # workflow. The action revokes the token when the job ends; nothing here
      # uploads, and the token itself never reaches the readiness check.
      - name: Exchange GitHub OIDC for a crates.io token
        id: crates-auth
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Check Cargo release readiness without uploading
        env:
          PALAMEDES_CRATES_OWNER: ${{ vars.CRATES_IO_OWNER }}
          PALAMEDES_CRATES_TOKEN_ISSUED: ${{ steps.crates-auth.outputs.token != '' }}
        run: node ./scripts/publish-rust-sdk.mjs --preflight ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

  # Example Verification only runs on pull requests and main pushes that touch
  # its path filters, so nothing guarantees it covered the release revision.
  # Run it here on that revision instead: the example smoke checks and the
  # browser matrix with its TanStack, React Router, Solid, Waku, Remix, and Vite
  # MDX delivery and failure proofs. Every upload job depends on it.
  example-verification:
    needs: determine-release
    if: needs.determine-release.outputs.should_publish == 'true'
    uses: ./.github/workflows/example-verification.yml
    with:
      run_browser: true

  validate-release:
    needs: determine-release
    if: needs.determine-release.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PALAMEDES_RUST_PROFILE: release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      # Runs before the build so a package that npm cannot mint a trusted
      # publishing token for stops the release in seconds, rather than after
      # the native packages have already shipped.
      - name: Verify deployed app-tracking routes before publication
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: node ./scripts/check-app-tracking-ready.mjs

      - name: Check first-publish readiness
        run: node ./scripts/check-first-publish.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--warn-only' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The one-time release overrides are checked against the release tag on
      # origin. Here an unreadable tag fails the run instead of only warning.
      - name: Check release package set
        env:
          PALAMEDES_RELEASE_TAGS: required
        run: pnpm check:release-set

      - name: Check release wording
        run: pnpm check:release-wording

      - name: Build packages
        run: pnpm build

      - name: Check published TypeScript declarations
        run: pnpm check:published-types

      # Packs every JavaScript package in publish order and checks the manifests
      # consumers receive: `workspace:*` (the native optional dependencies)
      # becomes the exact release version and `workspace:^` becomes `^version`.
      # This job holds no publishing credentials, and the step runs for real
      # releases and dry runs alike, before any upload.
      - name: Pack JavaScript packages and verify release manifests
        run: node ./scripts/publish-package-if-needed.mjs --all-js --dry-run

      - name: Run tests
        run: pnpm test

      - name: Check types
        run: pnpm check-types

      - name: Verify Cargo SDK archives and independent registry consumer
        run: node ./scripts/publish-rust-sdk.mjs --dry-run

      - name: Run Rust workspace tests
        run: cargo test --workspace --locked

      - name: Verify enabled update-check opt-outs without network access
        run: node ./scripts/check-enabled-update-check.mjs

  publish-native:
    needs:
      - determine-release
      - preflight-cargo
      - validate-release
      - example-verification
    if: needs.determine-release.outputs.should_publish == 'true'
    # Keyed per package: one group for the whole matrix would let its legs
    # replace and cancel each other while they wait.
    concurrency:
      group: ${{ needs.determine-release.outputs.should_publish == 'true' && format('publish-native-{0}-{1}', github.ref, matrix.package_name) || format('publish-native-{0}-{1}', github.run_id, matrix.package_name) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name: "@palamedes/core-node-darwin-arm64"
            runner: macos-latest
            rust_target: ""
          - package_name: "@palamedes/cli-darwin-arm64"
            runner: macos-latest
            rust_target: ""
          - package_name: "@palamedes/core-node-linux-x64-gnu"
            runner: ubuntu-24.04
            rust_target: ""
          - package_name: "@palamedes/cli-linux-x64-gnu"
            runner: ubuntu-24.04
            rust_target: ""
          - package_name: "@palamedes/core-node-linux-x64-musl"
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            package_dir: packages/core-node-linux-x64-musl
          - package_name: "@palamedes/cli-linux-x64-musl"
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            package_dir: packages/cli-linux-x64-musl
          - package_name: "@palamedes/core-node-linux-arm64-gnu"
            runner: ubuntu-24.04-arm
            rust_target: ""
          - package_name: "@palamedes/cli-linux-arm64-gnu"
            runner: ubuntu-24.04-arm
            rust_target: ""
          - package_name: "@palamedes/core-node-linux-arm64-musl"
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            package_dir: packages/core-node-linux-arm64-musl
          - package_name: "@palamedes/cli-linux-arm64-musl"
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            package_dir: packages/cli-linux-arm64-musl
          - package_name: "@palamedes/core-node-win32-x64-msvc"
            runner: windows-2025
            rust_target: ""
          - package_name: "@palamedes/cli-win32-x64-msvc"
            runner: windows-2025
            rust_target: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: true
      PALAMEDES_ALLOW_CROSS_NATIVE: ${{ matrix.rust_target != '' && '1' || '0' }}
      PALAMEDES_RUST_PROFILE: release
      PALAMEDES_UPDATE_ENDPOINT: https://sebastian-app-tracking.b-cdn.net/v1/versions/palamedes/github/stable

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          rust-cache: "false"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native package
        if: matrix.rust_target == ''
        run: pnpm --filter "${{ matrix.package_name }}" build

      - name: Smoke-test native Node package
        if: startsWith(matrix.package_name, '@palamedes/core-node-') && matrix.rust_target == ''
        run: pnpm --filter "${{ matrix.package_name }}" exec node --input-type=module -e "import { createRequire } from 'node:module'; const require = createRequire(import.meta.url); const native = require('./palamedes-node.node'); if (typeof native.transformMacros !== 'function') process.exit(1)"

      - name: Smoke-test native CLI package
        if: startsWith(matrix.package_name, '@palamedes/cli-') && matrix.rust_target == ''
        env:
          PALAMEDES_UPDATE_CHECK: "0"
        run: >
          pnpm --filter "${{ matrix.package_name }}" exec node --input-type=module -e
          "import { execFileSync } from 'node:child_process';
          const bin = process.platform === 'win32' ? './bin/pmds.exe' : './bin/pmds';
          const out = execFileSync(bin, ['version'], { encoding: 'utf8' });
          if (!out.includes('pmds (Palamedes)')) process.exit(1)"

      - name: Verify musl native package
        if: matrix.rust_target != ''
        uses: ./.github/actions/verify-musl-native
        with:
          package_name: "${{ matrix.package_name }}"
          package_dir: "${{ matrix.package_dir }}"
          rust_target: "${{ matrix.rust_target }}"

      - name: Publish native package
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: node ./scripts/publish-package-if-needed.mjs "${{ matrix.package_name }}"

  # Waits for the native packages so a failed native build stops crates.io as
  # well as npm: otherwise crates.io could ship the release while the
  # JavaScript packages, which need every native package, do not. After the
  # native lane, both remaining uploads are already proven by the Cargo
  # preflight and the JavaScript pack check, so they run side by side.
  publish-cargo:
    needs:
      - determine-release
      - preflight-cargo
      - validate-release
      - example-verification
      - publish-native
    if: ${{ needs.determine-release.outputs.should_publish == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
    concurrency:
      group: ${{ needs.determine-release.outputs.should_publish == 'true' && format('publish-cargo-{0}', github.ref) || format('publish-cargo-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          pnpm-cache: "false"

      - name: Authenticate to crates.io with OIDC
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish Cargo SDK in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          PALAMEDES_CRATES_OWNER: ${{ vars.CRATES_IO_OWNER }}
        run: node ./scripts/publish-rust-sdk.mjs

  publish-js:
    needs:
      - determine-release
      - publish-native
    if: ${{ needs.determine-release.outputs.should_publish == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
    concurrency:
      group: ${{ needs.determine-release.outputs.should_publish == 'true' && format('publish-js-{0}', github.ref) || format('publish-js-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          rust-cache: "false"
          registry-url: https://registry.npmjs.org

      # The JS package build also rebuilds the host-native CLI and core-node
      # packages in parallel. Resolve the repository toolchain once up front so
      # their cargo proxies cannot race while rustup installs it.
      - name: Materialize pinned Rust toolchain
        run: cargo --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: >
          pnpm -r
          --filter @palamedes/core
          --filter @palamedes/config
          --filter @palamedes/runtime
          --filter @palamedes/core-node
          --filter @palamedes/transform
          --filter @palamedes/extractor
          --filter @palamedes/react
          --filter @palamedes/remix
          --filter @palamedes/waku
          --filter @palamedes/tanstack
          --filter @palamedes/react-router
          --filter @palamedes/solid
          --filter @palamedes/cli
          --filter @palamedes/vite-plugin
          --filter @palamedes/next-plugin
          --filter ./packages/palamedes
          --filter create-palamedes
          build

      - name: Publish JavaScript packages
        run: node ./scripts/publish-package-if-needed.mjs --all-js

  # A publish job that dies partway through leaves the registry carrying a mixed
  # release set. Nothing reported that until someone tried to install, so assert
  # the finished state instead of trusting the publish jobs' exit codes.
  verify-release:
    needs:
      - determine-release
      - publish-native
      - publish-js
      - publish-cargo
    if: ${{ needs.determine-release.outputs.should_publish == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # npm can take several minutes to serve a freshly published version from
      # every read replica. The script spends this budget only on packages that
      # were missing from its initial sweep, leaving ample time in this job.
      PALAMEDES_REGISTRY_RETRY_BUDGET_MS: 300000
      PALAMEDES_REGISTRY_RETRY_MS: 15000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          pnpm-cache: "false"
          rust: "false"
          rust-cache: "false"
          registry-url: https://registry.npmjs.org

      - name: Verify every package reached the registry
        run: node ./scripts/check-published-versions.mjs

      - name: Verify every Cargo SDK crate reached crates.io
        run: node ./scripts/check-published-crates.mjs

  retire-release-failure:
    needs:
      - determine-release
      - verify-release
    if: ${{ needs.determine-release.outputs.should_publish == 'true' && needs.verify-release.result == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Retire release failure tracking issues
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "chore(release): publish workflow failed"
        run: >
          node ./scripts/open-or-refresh-issue.mjs
          --title "$TITLE"
          --label type:bug
          --close-comment "The release completed successfully, so this tracking issue is no longer active."

  notify-failure:
    needs:
      - determine-release
      - preflight-cargo
      - validate-release
      - example-verification
      - publish-native
      - publish-js
      - publish-cargo
      - verify-release
    # failure() misses a cancelled job, whether the whole run was cancelled or
    # a concurrency group replaced a pending upload, so check every result.
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && (needs.determine-release.result == 'failure' || needs.determine-release.outputs.should_publish == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Open or refresh the release failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "chore(release): publish workflow failed"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "The publish workflow failed or was cancelled, so this release may be only partially on npm or crates.io."
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| determine-release | ${{ needs.determine-release.result }} |"
            echo "| preflight-cargo | ${{ needs.preflight-cargo.result }} |"
            echo "| validate-release | ${{ needs.validate-release.result }} |"
            echo "| example-verification | ${{ needs.example-verification.result }} |"
            echo "| publish-native | ${{ needs.publish-native.result }} |"
            echo "| publish-js | ${{ needs.publish-js.result }} |"
            echo "| publish-cargo | ${{ needs.publish-cargo.result }} |"
            echo "| verify-release | ${{ needs.verify-release.result }} |"
            echo
            echo "Commit: \`${{ github.sha }}\`"
            echo
            echo "If recovery needs no repository change, re-run all jobs of this original run."
            echo "npm skips existing versions; Cargo skips only an identical, unyanked archive."
            echo "Do not force-publish a newer commit at this version: Cargo records the source commit in its archive, and npm does not replace existing versions."
            echo "If a source or workflow correction is needed after any upload, prepare a new coordinated release version."
            echo "See [partial-release recovery](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/CONTRIBUTING.md#recovering-a-partial-release)."
            echo
            echo "Run: $RUN_URL"
          } > issue-body.md

          node ./scripts/open-or-refresh-issue.mjs \
            --title "$TITLE" \
            --body-file issue-body.md \
            --label type:bug
