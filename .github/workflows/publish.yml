name: Publish

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish the current release version even without a release commit"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Build and smoke-test the native packages without publishing anything"
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# The release gate installs and executes the full dependency tree, so the jobs
# around it default to read-only; the publish jobs opt into `id-token: write`
# for trusted publishing and the failure notifier into `issues: write`.
permissions:
  contents: read

jobs:
  determine-release:
    runs-on: ubuntu-24.04
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Detect release commit
        id: release
        shell: bash
        env:
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && (inputs.force_publish || inputs.dry_run) && 'true' || 'false' }}
        run: |
          set -euo pipefail

          has_release_commit=false

          if [ "$FORCE_PUBLISH" = "true" ]; then
            has_release_commit=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base_ref="${{ github.event.before }}"
            if [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
              base_ref="$(git rev-parse HEAD^)"
            fi

            if git log --format=%s "$base_ref..${{ github.sha }}" | grep -Eq '^chore: release '; then
              has_release_commit=true
            fi
          fi

          if [ "$has_release_commit" = true ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  validate-release:
    needs: determine-release
    if: needs.determine-release.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PALAMEDES_RUST_PROFILE: release
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      # Runs before the build so a package that npm cannot mint a trusted
      # publishing token for stops the release in seconds, rather than after
      # the native packages have already shipped.
      - name: Check first-publish readiness
        run: node ./scripts/check-first-publish.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--warn-only' || '' }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release package set
        run: pnpm check:release-set

      - name: Build packages
        run: pnpm build

      - name: Check published TypeScript declarations
        run: pnpm check:published-types

      - name: Run tests
        run: pnpm test

      - name: Check types
        run: pnpm check-types

      - name: Run Rust workspace tests
        run: cargo test --workspace --locked

  publish-native:
    needs:
      - determine-release
      - validate-release
    if: needs.determine-release.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name: "@palamedes/core-node-darwin-arm64"
            runner: macos-14
            rust_target: ""
          - package_name: "@palamedes/cli-darwin-arm64"
            runner: macos-14
            rust_target: ""
          - package_name: "@palamedes/core-node-linux-x64-gnu"
            runner: ubuntu-24.04
            rust_target: ""
          - package_name: "@palamedes/cli-linux-x64-gnu"
            runner: ubuntu-24.04
            rust_target: ""
          - package_name: "@palamedes/core-node-linux-x64-musl"
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            package_dir: packages/core-node-linux-x64-musl
          - package_name: "@palamedes/cli-linux-x64-musl"
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            package_dir: packages/cli-linux-x64-musl
          - package_name: "@palamedes/core-node-linux-arm64-gnu"
            runner: ubuntu-24.04-arm
            rust_target: ""
          - package_name: "@palamedes/cli-linux-arm64-gnu"
            runner: ubuntu-24.04-arm
            rust_target: ""
          - package_name: "@palamedes/core-node-linux-arm64-musl"
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            package_dir: packages/core-node-linux-arm64-musl
          - package_name: "@palamedes/cli-linux-arm64-musl"
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            package_dir: packages/cli-linux-arm64-musl
          - package_name: "@palamedes/core-node-win32-x64-msvc"
            runner: windows-2025
            rust_target: ""
          - package_name: "@palamedes/cli-win32-x64-msvc"
            runner: windows-2025
            rust_target: ""
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: true
      PALAMEDES_ALLOW_CROSS_NATIVE: ${{ matrix.rust_target != '' && '1' || '0' }}
      PALAMEDES_RUST_PROFILE: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add musl Rust target
        if: matrix.rust_target != ''
        run: rustup target add "${{ matrix.rust_target }}"

      - name: Install musl toolchain
        if: matrix.rust_target != ''
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native package
        if: "!(startsWith(matrix.package_name, '@palamedes/core-node-') && matrix.rust_target != '')"
        run: pnpm --filter "${{ matrix.package_name }}" build

      # The core-node musl addon is a `cdylib`, so it cannot use musl's default
      # `+crt-static` (cargo refuses a statically linked cdylib) and must link
      # dynamically. Cross-linking that dynamic cdylib from the glibc host makes
      # the linker emit a glibc program interpreter (`ld-linux-*.so`), which then
      # fails to load inside a musl runtime. Building it in a musl-native
      # environment instead makes the toolchain resolve the correct
      # `ld-musl-*.so.1` loader. (The static-musl CLI binary has no such
      # problem, so it keeps building on the host above.)
      #
      # `rust:alpine` and `node:24-alpine` are multi-arch, so each musl leg pulls
      # the image matching its own runner; nothing is emulated.
      - name: Build musl core-node addon (native musl toolchain)
        if: startsWith(matrix.package_name, '@palamedes/core-node-') && matrix.rust_target != ''
        run: >
          docker run --rm
          -v "$PWD:/workspace"
          -w "/workspace/${{ matrix.package_dir }}"
          -e PALAMEDES_RUST_PROFILE=release
          rust:alpine
          sh -c "apk add --no-cache nodejs build-base &&
          node ../core-node/scripts/build-native.mjs"

      - name: Smoke-test native Node package
        if: startsWith(matrix.package_name, '@palamedes/core-node-') && matrix.rust_target == ''
        run: pnpm --filter "${{ matrix.package_name }}" exec node --input-type=module -e "import { createRequire } from 'node:module'; const require = createRequire(import.meta.url); const native = require('./palamedes-node.node'); if (typeof native.transformMacros !== 'function') process.exit(1)"

      - name: Smoke-test musl native Node package
        if: startsWith(matrix.package_name, '@palamedes/core-node-') && matrix.rust_target != ''
        run: >
          docker run --rm
          -v "$PWD:/workspace"
          -w "/workspace/${{ matrix.package_dir }}"
          node:24-alpine
          node --input-type=module -e
          "import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const native = require('./palamedes-node.node');
          if (typeof native.transformMacros !== 'function') process.exit(1)"

      - name: Smoke-test native CLI package
        if: startsWith(matrix.package_name, '@palamedes/cli-') && matrix.rust_target == ''
        run: >
          pnpm --filter "${{ matrix.package_name }}" exec node --input-type=module -e
          "import { execFileSync } from 'node:child_process';
          const bin = process.platform === 'win32' ? './bin/pmds.exe' : './bin/pmds';
          const out = execFileSync(bin, ['version'], { encoding: 'utf8' });
          if (!out.includes('pmds (Palamedes)')) process.exit(1)"

      - name: Smoke-test musl native CLI package
        if: startsWith(matrix.package_name, '@palamedes/cli-') && matrix.rust_target != ''
        run: >
          docker run --rm
          -v "$PWD:/workspace"
          -w "/workspace/${{ matrix.package_dir }}"
          node:24-alpine
          node --input-type=module -e
          "import { execFileSync } from 'node:child_process';
          const out = execFileSync('./bin/pmds', ['version'], { encoding: 'utf8' });
          if (!out.includes('pmds (Palamedes)')) process.exit(1)"

      - name: Publish native package
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: node ./scripts/publish-package-if-needed.mjs "${{ matrix.package_name }}"

  publish-js:
    needs:
      - determine-release
      - publish-native
    if: ${{ needs.determine-release.outputs.should_publish == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      # The JS package build also rebuilds the host-native CLI and core-node
      # packages in parallel. Resolve the repository toolchain once up front so
      # their cargo proxies cannot race while rustup installs it.
      - name: Materialize pinned Rust toolchain
        run: cargo --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: >
          pnpm -r
          --filter @palamedes/core
          --filter @palamedes/config
          --filter @palamedes/runtime
          --filter @palamedes/core-node
          --filter @palamedes/transform
          --filter @palamedes/extractor
          --filter @palamedes/eslint-plugin
          --filter @palamedes/react
          --filter @palamedes/react-router-rsc
          --filter @palamedes/remix
          --filter @palamedes/waku
          --filter @palamedes/tanstack
          --filter @palamedes/solid
          --filter @palamedes/cli
          --filter @palamedes/vite-plugin
          --filter @palamedes/next-plugin
          --filter ./packages/palamedes
          --filter create-palamedes
          build

      - name: Publish JavaScript packages
        run: |
          failures=()
          publish_package() {
            if ! node ./scripts/publish-package-if-needed.mjs "$1"; then
              failures+=("$1")
            fi
          }
          publish_package @palamedes/core
          publish_package @palamedes/config
          publish_package @palamedes/runtime
          publish_package @palamedes/core-node
          publish_package @palamedes/transform
          publish_package @palamedes/extractor
          publish_package @palamedes/eslint-plugin
          publish_package @palamedes/react
          publish_package @palamedes/react-router-rsc
          publish_package @palamedes/remix
          publish_package @palamedes/waku
          publish_package @palamedes/tanstack
          publish_package @palamedes/solid
          publish_package @palamedes/cli
          publish_package @palamedes/vite-plugin
          publish_package @palamedes/next-plugin
          publish_package palamedes
          publish_package create-palamedes
          if ((${#failures[@]} > 0)); then
            echo "::error title=JavaScript package publishing failed::${failures[*]}"
            printf 'JavaScript package publish failures:\n%s\n' "${failures[*]}" >&2
            exit 1
          fi

  # A publish job that dies partway through leaves the registry carrying a mixed
  # release set. Nothing reported that until someone tried to install, so assert
  # the finished state instead of trusting the publish jobs' exit codes.
  verify-release:
    needs:
      - determine-release
      - publish-native
      - publish-js
    if: ${{ needs.determine-release.outputs.should_publish == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify every package reached the registry
        run: node ./scripts/check-published-versions.mjs

  notify-failure:
    needs:
      - determine-release
      - validate-release
      - publish-native
      - publish-js
      - verify-release
    if: ${{ failure() && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && (needs.determine-release.result == 'failure' || needs.determine-release.outputs.should_publish == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Open or refresh the release failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "chore(release): publish workflow failed"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "The publish workflow failed, so this release may be only partially on npm."
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| determine-release | ${{ needs.determine-release.result }} |"
            echo "| validate-release | ${{ needs.validate-release.result }} |"
            echo "| publish-native | ${{ needs.publish-native.result }} |"
            echo "| publish-js | ${{ needs.publish-js.result }} |"
            echo "| verify-release | ${{ needs.verify-release.result }} |"
            echo
            echo "Commit: \`${{ github.sha }}\`"
            echo
            echo "Re-run the workflow with \`force_publish\` once the cause is fixed."
            echo "Packages that are already published at the release version are skipped,"
            echo "so a re-run is safe and only ships what is still missing."
            echo
            echo "Run: $RUN_URL"
          } > issue-body.md

          node ./scripts/open-or-refresh-issue.mjs \
            --title "$TITLE" \
            --body-file issue-body.md \
            --label bug
