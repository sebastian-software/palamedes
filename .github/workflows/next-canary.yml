name: Next.js Canary

# Out-of-graph Next client catalogs read `pmds-next:` marker literals back from
# the emitted chunks, which no Next API promises (ADR-030). This builds the
# route example against the newest Next canary, so a release that rewrites or
# drops the markers shows up here before it reaches the peer range. Canary moves
# independently of this repository, so it runs on a schedule, not per pull
# request.
on:
  schedule:
    - cron: "41 4 * * 1-5"
  workflow_dispatch:
    inputs:
      next_version:
        description: Next.js version or dist-tag to verify
        required: true
        default: canary
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: next-canary-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  contract:
    name: client catalog asset contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      # The plugin's own `next` dev dependency moves too, so the build resolves
      # one Next copy. pnpm records the exact version as a release-age exclusion.
      - name: Install Next.js ${{ inputs.next_version || 'canary' }}
        id: next
        env:
          NEXT_TAG: ${{ inputs.next_version || 'canary' }}
        run: |
          set -euo pipefail
          if [[ ! "$NEXT_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::next_version must be one version or dist-tag"
            exit 1
          fi
          version="$(npm view "next@$NEXT_TAG" version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Verifying the client catalog asset contract against next@$version." >> "$GITHUB_STEP_SUMMARY"
          pnpm --filter @palamedes/example-nextjs-route --filter @palamedes/next-plugin add "next@$version"

      - name: Verify Next client catalog asset contract
        id: contract
        run: pnpm --dir examples/nextjs-route build:catalog-assets

      # One long-lived issue that is refreshed in place and closed by the next
      # passing scheduled run.
      - name: Open or refresh the tracking issue
        if: failure() && github.event_name == 'schedule' && steps.contract.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "fix(next-plugin): Next.js canary breaks the client catalog asset contract"
          NEXT_VERSION: ${{ steps.next.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "\`pnpm --dir examples/nextjs-route build:catalog-assets\` failed against \`next@$NEXT_VERSION\`."
            echo
            echo "\`experimentalClientCatalogAssets\` finds translated client modules through their"
            echo "\`pmds-next:\` marker literals in the emitted chunks. Check whether this canary"
            echo "rewrites or drops them before the release reaches the \`next\` peer range; see"
            echo "[ADR-030](https://github.com/${{ github.repository }}/blob/main/adr/030-next-client-catalogs-outside-the-bundler-graph.md)."
            echo
            echo "Run: $RUN_URL"
          } > issue-body.md

          node ./scripts/open-or-refresh-issue.mjs \
            --title "$TITLE" \
            --body-file issue-body.md \
            --label stability

      - name: Close the tracking issue
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "fix(next-plugin): Next.js canary breaks the client catalog asset contract"
        run: >
          node ./scripts/open-or-refresh-issue.mjs
          --title "$TITLE"
          --label stability
          --close-comment "The scheduled Next.js canary run passes the client catalog asset contract again."
