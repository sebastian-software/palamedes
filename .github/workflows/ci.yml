name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 24
            full: true
          - os: ubuntu-24.04
            node: 22
            full: true
          - os: macos-14
            node: 24
            full: false
          - os: windows-2025
            node: 24
            full: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack
        run: corepack enable

      - name: Restore pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # `pnpm build` shells out to cargo for the native packages, so every
      # validate leg would otherwise rebuild the oxc workspace from scratch.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 24
        run: pnpm exec playwright install --with-deps chromium

      - name: Check release package set
        if: ${{ matrix.full }}
        run: pnpm check:release-set

      - name: Check JavaScript and TypeScript formatting
        run: pnpm format:check

      - name: Run JavaScript and TypeScript lint
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Verify Next.js RSC request scope with Turbopack
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 24
        run: pnpm --filter @palamedes/example-nextjs-cookie test:rsc-scope

      - name: Verify Next.js RSC request scope with Webpack
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 24
        run: pnpm --filter @palamedes/example-nextjs-cookie test:rsc-scope:webpack

      - name: Verify React Router RSC request scope
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 24
        run: pnpm verify:react-router-rsc

      - name: Verify Next.js development catalog invalidation
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 24
        run: pnpm --filter @palamedes/example-nextjs-cookie test:message-splitting:development

      - name: Test ESLint and Oxlint adapter
        run: pnpm --filter @palamedes/eslint-plugin test

      - name: Check parser-free browser runtime
        if: ${{ matrix.full }}
        run: pnpm --filter @palamedes/example-vite-mdx build && node ./scripts/check-runtime-browser-bundle.mjs

      - name: Check published TypeScript declarations
        if: ${{ matrix.full }}
        run: pnpm check:published-types

      - name: Verify ICU semantics proof
        if: ${{ matrix.full }}
        run: pnpm proof:icu:check

      - name: Check llms context surface
        if: ${{ matrix.full }}
        run: pnpm check:llms

      - name: Build site
        if: ${{ matrix.full }}
        run: pnpm build:site

      - name: Typecheck site
        if: ${{ matrix.full }}
        run: pnpm --filter @palamedes/site typecheck

      - name: Smoke-test native binding load
        if: ${{ !matrix.full }}
        run: pnpm --filter @palamedes/core-node exec node -e "const core = require('./dist/index.cjs'); if (typeof core.transformMacrosNative !== 'function') process.exit(1)"

      # These suites exercise portable path handling. Browser/end-to-end and
      # Linux-only native packaging coverage remain in their dedicated gates.
      - name: Test path-sensitive packages
        if: ${{ !matrix.full }}
        run: pnpm test:platform

      - name: Run tests
        if: ${{ matrix.full }}
        run: pnpm test

      - name: Collect JavaScript coverage
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 24
        run: pnpm test:coverage

      - name: Upload JavaScript coverage summary
        if: ${{ !cancelled() && matrix.os == 'ubuntu-24.04' && matrix.node == 24 }}
        uses: actions/upload-artifact@v7
        with:
          name: javascript-coverage
          path: coverage/javascript/coverage-summary.json
          if-no-files-found: warn

      - name: Test lifecycle-free CLI package
        if: ${{ !matrix.full }}
        run: pnpm --filter @palamedes/cli test

      - name: Check types
        if: ${{ matrix.full }}
        run: pnpm check-types

  validate-rust:
    name: validate-rust (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The core reads and writes project files, so its path handling ships on
        # Windows and macOS too. Format and lint are platform-independent and
        # stay on the Linux legs; only the tests fan out.
        include:
          - os: ubuntu-24.04
            toolchain: stable
            lint: true
          - os: ubuntu-24.04
            toolchain: "1.95"
            lint: true
          - os: windows-2025
            toolchain: stable
            lint: false
          - os: macos-14
            toolchain: stable
            lint: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-24.04' && matrix.toolchain == 'stable'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        if: ${{ matrix.lint }}
        run: cargo fmt --all --check

      - name: Run Rust lints
        if: ${{ matrix.lint }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Collect Rust coverage
        if: matrix.os == 'ubuntu-24.04' && matrix.toolchain == 'stable'
        run: |
          mkdir -p coverage/rust
          cargo llvm-cov --workspace --locked --json --summary-only --output-path coverage/rust/coverage-summary.json

      - name: Upload Rust coverage summary
        if: ${{ !cancelled() && matrix.os == 'ubuntu-24.04' && matrix.toolchain == 'stable' }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: coverage/rust/coverage-summary.json
          if-no-files-found: warn

      # Palamedes ships prebuilt binaries for five platforms, so anything baked
      # into the executable multiplies. Checked once, on the pinned toolchain,
      # because the number only has to be watched — not watched twice.
      - name: Check shipped binary size
        if: matrix.toolchain == '1.95'
        run: node ./scripts/check-binary-size.mjs
