name: Verify musl native package
description: Build and smoke-test a musl native package without publishing it.

inputs:
  package_name:
    description: Native package to build and smoke-test.
    required: true
  package_dir:
    description: Workspace-relative directory of the native package.
    required: true
  rust_target:
    description: Rust target required by a musl CLI package.
    required: true
  cargo-cache:
    description: Cache Cargo downloads and compilation inside the Alpine build container.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate musl package input
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package_name }}
      run: |
        case "$PACKAGE_NAME" in
          @palamedes/core-node-linux-*-musl|@palamedes/cli-linux-*-musl) ;;
          *)
            echo "Unsupported musl native package: $PACKAGE_NAME" >&2
            exit 1
            ;;
        esac

    # The static-musl CLI builds on the Linux host, matching the release lane.
    - name: Prepare musl CLI toolchain
      if: startsWith(inputs.package_name, '@palamedes/cli-')
      shell: bash
      env:
        RUST_TARGET: ${{ inputs.rust_target }}
      run: |
        rustup target add "$RUST_TARGET"
        sudo apt-get update
        sudo apt-get install -y musl-tools

    - name: Build musl native CLI package
      if: startsWith(inputs.package_name, '@palamedes/cli-')
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package_name }}
      run: pnpm --filter "$PACKAGE_NAME" build

    # A core-node musl addon is a dynamically linked cdylib. Build it in the
    # same native-musl environment used to prove that it will load in Alpine.
    - name: Resolve musl build image
      if: startsWith(inputs.package_name, '@palamedes/core-node-')
      id: musl-toolchain
      shell: bash
      run: |
        image=rust:1.96-alpine@sha256:a41f7740f8b45d45795624eec13a8b42263cc700f19f7e4e86e04d3dda08a479
        docker pull "$image"
        image_id=$(docker image inspect --format='{{.Id}}' "$image")
        echo "image=$image_id" >> "$GITHUB_OUTPUT"

    - name: Restore musl container Cargo cache
      if: startsWith(inputs.package_name, '@palamedes/core-node-') && inputs.cargo-cache == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/palamedes-musl-cargo/${{ inputs.rust_target }}
        # Restore only within one lockfile and actual toolchain image. The final
        # source hash lets immutable caches retain updated workspace compilation.
        key: palamedes-musl-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rust_target }}-${{ steps.musl-toolchain.outputs.image }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'crates/**', '.cargo/**', 'rust-toolchain.toml', 'packages/core-node/scripts/**', 'scripts/build-native-lib.mjs') }}
        restore-keys: |
          palamedes-musl-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rust_target }}-${{ steps.musl-toolchain.outputs.image }}-${{ hashFiles('Cargo.lock') }}-

    - name: Build musl core-node addon (native musl toolchain)
      if: startsWith(inputs.package_name, '@palamedes/core-node-')
      shell: bash
      env:
        CARGO_CACHE: ${{ inputs.cargo-cache }}
        RUST_TARGET: ${{ inputs.rust_target }}
        PACKAGE_DIR: ${{ inputs.package_dir }}
        MUSL_TOOLCHAIN_IMAGE: ${{ steps.musl-toolchain.outputs.image }}
      run: |
        cargo_cache_args=()
        if [ "$CARGO_CACHE" = "true" ]; then
          cache_root="$RUNNER_TEMP/palamedes-musl-cargo/$RUST_TARGET"
          mkdir -p "$cache_root/registry" "$cache_root/git" "$cache_root/target"
          cargo_cache_args+=(
            -v "$cache_root/registry:/usr/local/cargo/registry"
            -v "$cache_root/git:/usr/local/cargo/git"
            -v "$cache_root/target:/cache/target"
            -e CARGO_TARGET_DIR=/cache/target
          )
        fi
        docker run --rm \
          "${cargo_cache_args[@]}" \
          -v "$PWD:/workspace" \
          -w "/workspace/$PACKAGE_DIR" \
          -e PALAMEDES_RUST_PROFILE=release \
          "$MUSL_TOOLCHAIN_IMAGE" \
          sh -c "apk add --no-cache nodejs build-base &&
          sysroot=\$(cd / && rustc --print sysroot) &&
          export PATH=\"\$sysroot/bin:\$PATH\" &&
          test \"\$(command -v cargo)\" = \"\$sysroot/bin/cargo\" &&
          test \"\$(command -v rustc)\" = \"\$sysroot/bin/rustc\" &&
          cargo --version &&
          node ../core-node/scripts/build-native.mjs"

    - name: Smoke-test musl native Node package
      if: startsWith(inputs.package_name, '@palamedes/core-node-')
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package_dir }}
      run: >
        docker run --rm
        -v "$PWD:/workspace"
        -w "/workspace/$PACKAGE_DIR"
        node:24-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
        node --input-type=module -e
        "import { createRequire } from 'node:module';
        const require = createRequire(import.meta.url);
        const native = require('./palamedes-node.node');
        if (typeof native.transformMacros !== 'function') process.exit(1)"

    - name: Smoke-test musl native CLI package
      if: startsWith(inputs.package_name, '@palamedes/cli-')
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package_dir }}
      run: >
        docker run --rm
        -e PALAMEDES_UPDATE_CHECK=0
        -v "$PWD:/workspace"
        -w "/workspace/$PACKAGE_DIR"
        node:24-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
        node --input-type=module -e
        "import { execFileSync } from 'node:child_process';
        const out = execFileSync('./bin/pmds', ['version'], { encoding: 'utf8' });
        if (!out.includes('pmds (Palamedes)')) process.exit(1)"
