name: Set up workspace
description: Set up Node.js, Corepack, pnpm and the Rust workspace toolchain.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "24"
  pnpm-cache:
    description: Restore the pnpm dependency cache.
    required: false
    default: "true"
  rust:
    description: Install the Rust toolchain.
    required: false
    default: "true"
  rust-cache:
    description: Restore the Rust build cache.
    required: false
    default: "true"
  rust-toolchain:
    description: Rust toolchain to install when Rust is enabled.
    required: false
    default: stable
  rust-components:
    description: Comma-separated Rust components to install.
    required: false
    default: ""
  registry-url:
    description: Optional npm registry URL used for publishing jobs.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    # Node.js 26 does not bundle Corepack, while Node.js 24 does and a global install
    # over the bundled shims fails on Windows (EEXIST). Install it only when missing,
    # before pnpm cache lookup.
    - name: Install and enable Corepack
      shell: bash
      run: |
        if ! command -v corepack >/dev/null 2>&1; then
          npm install --global corepack@0.36.0
        fi
        corepack enable

    # Corepack has to run before setup-node asks pnpm for the cache directory.
    - name: Restore pnpm cache
      if: inputs.pnpm-cache == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Set up Rust
      if: inputs.rust == 'true'
      uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: ${{ inputs.rust-components }}

    - name: Cache Rust build artifacts
      if: inputs.rust == 'true' && inputs.rust-cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
